version: 2
enable-beta-ecosystems: true

updates:
  # GitHub Actions
  - package-ecosystem: github-actions
    groups:
      github-actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    directory: /
    schedule:
      interval: daily

  # Workspace root
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      root-runtime-deps:
        update-types: ["minor", "patch"]
        applies-to: version-updates
        patterns:
          - "*"

  # Code generation scripts
  - package-ecosystem: pub
    directory: /scripts
    schedule:
      interval: daily
    groups:
      codegen-tools:
        update-types: ["minor", "patch"]
        applies-to: version-updates
        patterns:
          - dart_style
          - mustache_template
          - recase
          - "*"

  # Core plugin
  - package-ecosystem: pub
    directory: /maplibre_gl
    schedule:
      interval: daily
    groups:
      maplibre-gl-core:
        update-types: ["minor", "patch"]
        applies-to: version-updates
        patterns:
          - "*"

  # Web implementation
  - package-ecosystem: pub
    directory: /maplibre_gl_web
    schedule:
      interval: daily
    groups:
      maplibre-gl-web:
        update-types: ["minor", "patch"]
        applies-to: version-updates
        patterns:
          - "*"

  # Platform interface
  - package-ecosystem: pub
    directory: /maplibre_gl_platform_interface
    schedule:
      interval: daily
    groups:
      platform-interface:
        update-types: ["minor", "patch"]
        applies-to: version-updates
        patterns:
          - "*"

  # Example app dependencies
  - package-ecosystem: pub
    directory: /maplibre_gl_example
    schedule:
      interval: daily
    groups:
      example-deps:
        update-types: ["minor", "patch"]
        applies-to: version-updates
        patterns:
          - "*"

  # Android Gradle (core plugin module)
  - package-ecosystem: gradle
    directory: /maplibre_gl/android
    schedule:
      interval: weekly
    groups:
      gradle-plugin:
        update-types: ["minor", "patch"]
        applies-to: version-updates
        patterns:
          - gradle
          - com.android.tools.build:gradle
      kotlin:
        update-types: ["minor", "patch"]
        applies-to: version-updates
        patterns:
          - org.jetbrains.kotlin:kotlin-*
      androidx-core:
        update-types: ["minor", "patch"]
        applies-to: version-updates
        patterns:
          - androidx.core:*
          - androidx.annotation:*
      google-maps-play-services:
        update-types: ["minor", "patch"]
        applies-to: version-updates
        patterns:
          - com.google.android.gms:play-services-*

  # Android Gradle (example app)
  - package-ecosystem: gradle
    directory: /maplibre_gl_example/android
    schedule:
      interval: weekly
    groups:
      gradle-plugin:
        update-types: ["minor", "patch"]
        applies-to: version-updates
        patterns:
          - gradle
          - com.android.tools.build:gradle
      kotlin:
        update-types: ["minor", "patch"]
        applies-to: version-updates
        patterns:
          - org.jetbrains.kotlin:kotlin-*
      androidx:
        update-types: ["minor", "patch"]
        applies-to: version-updates
        patterns:
          - androidx.*:*
      google-play-services:
        update-types: ["minor", "patch"]
        applies-to: version-updates
        patterns:
          - com.google.android.gms:play-services-*
